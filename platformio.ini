; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Default env = production: DEBUG_SERIAL logging compiled out (see include/debug_log.h).
; Use curiosity_nano_db_debug below for development work with logging enabled.
[env:curiosity_nano_db]
platform = atmelmegaavr
board = curiosity_nano_db
framework = arduino
; OneWire is vendored locally in lib/OneWire (patched for DxCore/AVR-Dx GPIO register layout
; support — upstream only handles __AVR_ATmega4809__, see lib/OneWire/util/OneWire_direct_gpio.h).
; Do not add paulstoffregen/OneWire back here — it would fetch the unpatched version alongside it.
; Note: `pio run` still fetches paulstoffregen/OneWire into .pio/libdeps on its own, because
; DallasTemperature's library.json declares it as a dependency. This is expected and harmless —
; verified with `pio run -v` that every OneWire.h/.cpp include resolves to lib/OneWire (the
; patched copy), not .pio/libdeps/OneWire. Do not "clean up" by deleting lib/OneWire.
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7
    milesburton/DallasTemperature@^3.11.0
build_flags =
    -DENABLE_DEBUG_LOG=0

[env:curiosity_nano_db_debug]
extends = env:curiosity_nano_db
build_flags =
    -DENABLE_DEBUG_LOG=1
